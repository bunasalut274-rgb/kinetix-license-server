<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kinetix Admin</title><style>body{background:#08090d;color:#eee;font:16px Segoe UI;padding:32px}button,input,select{padding:10px;margin:4px;background:#191522;color:#fff;border:1px solid #7134d5;border-radius:6px}button{cursor:pointer;background:#7134d5}table{margin-top:20px;border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #292333}small{color:#aaa}</style></head><body><h1>Kinetix Pro Admin</h1><p><small>Admin API key is used only for this session and is never stored.</small></p><input id="key" type="password" placeholder="KINETIX_ADMIN_KEY"><input id="count" type="number" value="1" min="1" max="1000"><select id="plan"><option value="MONTHLY">PRO MONTHLY</option><option value="YEARLY">PRO YEARLY</option><option value="LIFETIME" selected>PRO LIFETIME</option></select><button onclick="generate()">Generate License</button><button onclick="load()">Refresh Licenses</button><pre id="out"></pre><table><thead><tr><th>Key ID</th><th>Status</th><th>Device hash</th><th>Activated</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><script>const auth=()=>({'X-Kinetix-Admin-Key':document.querySelector('#key').value,'Content-Type':'application/json'});async function generate(){const r=await fetch('/api/license/generate',{method:'POST',headers:auth(),body:JSON.stringify({count:+document.querySelector('#count').value,plan:document.querySelector('#plan').value})});document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2);load()}async function load(){const r=await fetch('/api/license/status',{headers:auth()});if(!r.ok){out.textContent='Unauthorized';return}const data=await r.json();rows.innerHTML=data.map(x=>`<tr><td>${x.keyId}</td><td>${x.status}</td><td>${x.deviceIdHash||'-'}</td><td>${x.activationDate||'-'}</td><td>${x.status==='ACTIVE'?`<button onclick="revoke('${x.keyId}')">REVOKE</button>`:'-'}</td></tr>`).join('')}async function revoke(key){if(!confirm('Revoke this license?'))return;await fetch('/api/license/revoke',{method:'POST',headers:auth(),body:JSON.stringify({licenseKey:key})});load()}</script></body></html>
